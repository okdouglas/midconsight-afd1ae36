    <h1>New permits, scored and on a map. Every week.</h1>
    <p>Oklahoma drilling permits from the Corporation Commission, ranked as leads for land and business development teams.</p>
    <p><a href="/auth">Start free</a> <a href="/#platform">See the platform</a></p>
    <p>Import runs every Monday. No credit card to start.</p>
    <p>Real permits, Oklahoma Corporation Commission filings, imported through Oct 5.</p>
    <ul><li>115 permits on the map</li><li>25 counties with a filing</li><li>8 weekly imports</li><li>17 in the latest import</li></ul>
    <p>Shared feed, Aug 17 to Oct 5. All counts as of Oct 5.</p>
    <section id="platform"><h2>Start the week with a list, not a search.</h2><p>Monday morning, the new permits are already in. Sorted, scored and on the map.</p><ul><li>Imported every Monday. New Intent to Drill filings from the Corporation Commission land in one list.</li><li>Scored on arrival. Hot leads sort first. Warm leads sort next.</li><li>Mapped by county. Open the map and see where the week’s permits sit.</li></ul><p>How the page reads</p><ul><li>New permits, scored. Navy. Read first.</li><li>Operator, county and filing date, in order. Slate. Read.</li><li>Source: Oklahoma Corporation Commission. Muted. Scan past.</li><li>Open this permit Blue. Act on.</li><li>Hot lead Red. Heat only.</li></ul></section>
    <section><h2>Oklahoma Intent to Drill filings, scored hot or warm</h2><p>Every filing carries its operator’s score. Strong ones show as hot. The next tier shows as warm. The rest stay steady.</p><p>A real lead</p><p>Camino Natural Resources LLC, Hartley S 0707 30-19-1WXH. Hot.</p><ul><li>County: Grady</li><li>Location: Sec 25, 07N, 08W</li><li>Total depth: 24,978 ft</li><li>Approved: Oct 2, 2026</li><li>API: 35-051-00726-0000</li><li>Imported: Oct 5, 2026</li></ul><p>Oklahoma Corporation Commission filing, imported Oct 5.</p><p>The 115 permits in the shared feed</p><ul><li>41 Hot</li><li>30 Warm</li><li>44 Steady</li></ul><p>As of Oct 5.</p></section>
    <section id="scoring"><h2>Hot, warm, steady. Here is the rule.</h2><p>No black box. Each operator is scored on two numbers: how many permits it has in the feed, and how many arrived in the last 30 days.</p><ul><li>Hot: 5 or more permits in the feed or 3 or more imported in the last 30 days</li><li>Warm: 3 or 4 permits in the feed or 2 imported in the last 30 days</li><li>Steady: Fewer than 3 permits in the feed and Fewer than 2 imported in the last 30 days</li></ul><p>Camino Natural Resources LLC has 5 permits in the feed. Five or more is hot. As of Oct 5.</p><ul><li>The score belongs to the operator. Every permit it files carries that tier.</li><li>In Lead Research, an operator that is not hot or warm moves up to warm when it has a permit approved in the last 7 days, or a horizontal or directional well.</li><li>The company list calls the bottom tier cold.</li></ul></section>
    <section><h2>Operators, companies and deals in one place</h2><p>Each operator gets a company record built from its permits. Link a permit to a deal and move it down the pipeline.</p><ul><li>New Lead</li><li>Contacted</li><li>Qualified</li><li>Proposal</li><li>Closed Won</li><li>Closed Lost</li></ul><p>Company records and the deals pipeline are on Pro.</p></section>
    <section><h2>Research a lead, then export it to CSV</h2><h3>Research</h3><p>Triage new permits in Lead Research. Mark each one new, researching, verified or current client.</p><p>Starter and Pro</p><h3>Export</h3><p>Export the map view to CSV or Excel. Take the list to your call sheet.</p><p>Every plan</p></section>
    <section id="how-it-works"><h2>Import runs every Monday.</h2><p>The Corporation Commission posts filings daily. MidconSight imports them once a week and sorts them for you.</p><h3>How a Monday goes</h3><ul><li>01 Monday. The import runs. New Oklahoma filings arrive in one batch.</li><li>02 Then. The list is scored. Hot first. Warm next. Everything on the map.</li><li>03 Then. The call list is yours. Pick the hot ones. Research each, then make the call.</li></ul></section>
    <section><h2>Voice you can count on.</h2><ul><li>County. Where the well will be.</li><li>Operator. Who filed it.</li><li>Numbers. Depth, dates and API. As filed.</li><li>Weekly. The import runs every Monday.</li></ul></section>
    <section id="pricing"><h2>Plans: Free, Starter $10, Pro $20</h2><p>Start free. Move up when you want current permits or the deals pipeline.</p><h3>Free $0</h3><p>Shared permits older than 30 days.</p><ul><li>Dashboard and county map</li><li>CSV and Excel export from the map</li></ul><h3>Starter $10/mo</h3><p>Everything in Free, with current permits.</p><ul><li>No 30-day delay on permits</li><li>Lead Research</li><li>Data import</li></ul><h3>Pro $20/mo</h3><p>Everything in Starter, with the full pipeline.</p><ul><li>Company records</li><li>Deals pipeline</li><li>Product catalog and matching</li></ul><p>Paid plans are set up by request inside the app. Self-serve checkout is coming.</p></section>
    <section id="faq"><h2>Questions</h2><dl><dt>Where do the permits come from?</dt><dd>From Intent to Drill filings and related formation data published by the Oklahoma Corporation Commission.</dd><dt>How often does it update?</dt><dd>Weekly. The import runs every Monday.</dd><dt>Does it cover states other than Oklahoma?</dt><dd>Not today. MidconSight is built for Oklahoma and the Mid-Continent, and the data is Oklahoma permits.</dd><dt>What does a lead score mean?</dt><dd>Each operator is scored on its permit count and its recent filings. Hot is 5 or more permits, or 3 or more in the last 30 days. Warm is 3 or 4 permits, or 2 in the last 30 days. Everything else is steady.</dd><dt>What can I do with a lead?</dt><dd>See it on the county map, research it, link it to a company record, add it to the deals pipeline, and export to CSV.</dd><dt>What does the Free plan include?</dt><dd>Free users see shared permits older than 30 days. Starter is $10 a month and Pro is $20 a month.</dd><dt>The OCC publishes this data. Why use MidconSight?</dt><dd>The OCC posts the filings. MidconSight sorts each week's permits into scored leads on a map, with operators, companies and deals tracked beside them. Source files are the OCC's.</dd><dt>Who builds MidconSight?</dt><dd>Mayberry Advisory.</dd></dl></section>
