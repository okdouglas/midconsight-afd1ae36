    <h1>New permits, scored and on a map. Every week.</h1>
    <p>Oklahoma drilling permits from the Corporation Commission, ranked as leads for land and business development teams.</p>
    <p><a href="/auth">Start free</a> <a href="/#platform">See the platform</a></p>
    <p>Import runs every Monday. No credit card to start.</p>
    <p>Real permits, Oklahoma Corporation Commission filings, imported through Oct 5.</p>
    <ul><li>1,394 permits on the map</li><li>53 counties with a filing</li><li>24 months of history</li><li>17 in the latest import</li></ul>
    <p>Shared feed, Oct 2024 to Oct 7. All counts as of Oct 7.</p>
    <section id="platform"><h2>Start the week with a list, not a search.</h2><p>Monday morning, the new permits are already in. Sorted, scored and on the map.</p><ul><li>Imported every Monday. New Intent to Drill filings from the Corporation Commission land in one list.</li><li>Scored on arrival. Hot leads sort first. Warm leads sort next.</li><li>Mapped by county. Open the map and see where the week’s permits sit.</li></ul><p>How the page reads</p><ul><li>New permits, scored. Navy. Read first.</li><li>Operator, county and filing date, in order. Slate. Read.</li><li>Source: Oklahoma Corporation Commission. Muted. Scan past.</li><li>Open this permit Blue. Act on.</li><li>Hot lead Red. Heat only.</li></ul></section>
    <section><h2>Oklahoma Intent to Drill filings, scored hot or warm</h2><p>Every filing carries its operator’s score. Hot means actively permitting, with real volume on the way. Warm means wells still in the pipeline. Cold means most of the pipeline has played out.</p><p>A real lead</p><p>Camino Natural Resources LLC, Hartley S 0707 30-19-1WXH. Hot.</p><ul><li>County: Grady</li><li>Location: Sec 25, 07N, 08W</li><li>Total depth: 24,978 ft</li><li>Approved: Oct 2, 2026</li><li>API: 35-051-00726-0000</li><li>Imported: Oct 5, 2026</li></ul><p>Oklahoma Corporation Commission filing, imported Oct 5.</p><p>The 1,394 permits in the shared feed</p><ul><li>630 Hot</li><li>570 Warm</li><li>194 Cold</li></ul><p>As of Oct 7.</p></section>
    <section id="scoring"><h2>Hot, warm, cold. Built on how long wells really take.</h2><p>No black box. We measured how long Oklahoma wells take to go from permit to first production. A permit is worth the chance its well is still coming, and that fades on the measured curve. An operator’s pipeline is the sum of its permits.</p><ul><li>Hot: heat 1.6 or more, with a permit in the last 30 days. 3 permits this week, or 2 this month.</li><li>Warm: heat 0.75 or more. 3 permits 3 months ago, or 1 this month.</li><li>Cold: heat Under 0.75. 1 permit 6 months ago.</li></ul><p>Today, 20 of 160 operators in the feed are hot, 44 are warm and 96 are cold. As of Oct 7.</p><ul><li>The median horizontal well takes about 6 months from permit to first production. About 1 in 6 permits never becomes a producing well. The weights come from 6,590 Oklahoma permits.</li><li>Only new drills count. Amendments and recompletions re-approve a well that already has a permit, so they add nothing.</li><li>Permits count for up to 12 months. Older ones add nothing.</li><li>The score belongs to the operator. Every permit it files carries that tier.</li><li>Cold does not mean a bad operator. It means little of its pipeline is left. A new filing moves it back up.</li></ul></section>
    <section><h2>Operators, companies and deals in one place</h2><p>Each operator gets a company record built from its permits. Link a permit to a deal and move it down the pipeline.</p><ul><li>New Lead</li><li>Contacted</li><li>Qualified</li><li>Proposal</li><li>Closed Won</li><li>Closed Lost</li></ul><p>Free accounts track up to 3 deals. Paid plans have no limit.</p></section>
    <section><h2>Research a lead, then export it to CSV</h2><h3>Research</h3><p>Triage new permits in Lead Research. Mark each one new, researching, verified or current client.</p><p>Every plan</p><h3>Export</h3><p>Export the map view to CSV or Excel. Take the list to your call sheet.</p><p>Every plan</p></section>
    <section id="how-it-works"><h2>Import runs every Monday.</h2><p>The Corporation Commission posts filings daily. MidconSight imports them once a week and sorts them for you.</p><h3>How a Monday goes</h3><ul><li>01 Monday. The import runs. New Oklahoma filings arrive in one batch.</li><li>02 Then. The list is scored. Hot first. Warm next. Everything on the map.</li><li>03 Then. The call list is yours. Pick the hot ones. Research each, then make the call.</li></ul></section>
    <section><h2>Voice you can count on.</h2><ul><li>County. Where the well will be.</li><li>Operator. Who filed it.</li><li>Numbers. Depth, dates and API. As filed.</li><li>Weekly. The import runs every Monday.</li></ul></section>
    <section id="pricing"><h2>Plans: Free, Starter $10, Pro $20</h2><p>Start free with the last 30 days of permits. Move up for the full history and no limits.</p><h3>Free $0</h3><p>Permits from the last 30 days.</p><ul><li>Dashboard, map, companies and Lead Research</li><li>Up to 3 deals and 3 products</li><li>CSV and Excel export from the map</li></ul><h3>Starter $10/mo</h3><p>Everything in Free, with the full history.</p><ul><li>Full permit history</li><li>Operator scores for every operator</li><li>Unlimited deals and products</li></ul><h3>Pro $20/mo</h3><p>Everything in Starter.</p><ul><li>Import your own permit files</li><li>Import your product catalog from a spreadsheet</li></ul><p>Pay by card. Cancel any time from your account page. Annual billing saves two months.</p></section>
    <section id="faq"><h2>Questions</h2><dl><dt>Where do the permits come from?</dt><dd>From Intent to Drill filings and related formation data published by the Oklahoma Corporation Commission.</dd><dt>How often does it update?</dt><dd>Weekly. The import runs every Monday.</dd><dt>Does it cover states other than Oklahoma?</dt><dd>Not today. MidconSight is built for Oklahoma and the Mid-Continent, and the data is Oklahoma permits.</dd><dt>What does a lead score mean?</dt><dd>Each permit is weighted by how likely its well is still on the way, using the real permit-to-production timeline we measured from Oklahoma Corporation Commission data. An operator’s pipeline is the sum. Hot is a pipeline of 1.6 wells or more with a permit in the last 30 days. Warm is 0.75 or more. Cold is everything else.</dd><dt>What can I do with a lead?</dt><dd>See it on the county map, research it, link it to a company record, add it to the deals pipeline, and export to CSV.</dd><dt>What does the Free plan include?</dt><dd>Free shows permits from the last 30 days, with up to 3 deals and 3 products. Starter is $10 a month and Pro is $20 a month. Both give the full history, scores and no limits. Pro adds importing your own permit files and product catalog.</dd><dt>The OCC publishes this data. Why use MidconSight?</dt><dd>The OCC posts the filings. MidconSight sorts each week's permits into scored leads on a map, with operators, companies and deals tracked beside them. Source files are the OCC's.</dd><dt>Who builds MidconSight?</dt><dd>Mayberry Advisory.</dd></dl></section>
