[functions.import-itd-weekly]
# Called by pg_cron with a shared secret, not a logged-in user's JWT —
# so JWT verification must be off for this function specifically.
# The x-cron-secret header check inside the function is what guards it.
verify_jwt = false

[functions.send-welcome-email]
# Called by a Postgres trigger (via pg_net) with a shared secret, same
# reasoning as import-itd-weekly above.
verify_jwt = false

[functions.subscribe]
# Called by anonymous visitors from the landing page's newsletter form —
# they have no Supabase session/JWT at all.
verify_jwt = false

[functions.enrich-permits-rbdms]
# Called by pg_cron with a shared secret, same reasoning as import-itd-weekly.
verify_jwt = false

[functions.operator-profile]
# Called by pg_cron with a shared secret, same reasoning as import-itd-weekly.
verify_jwt = false

[functions.score-operators]
# Called by pg_cron with a shared secret, same reasoning as import-itd-weekly.
verify_jwt = false

[functions.stripe-webhook]
# Called by Stripe, not a logged-in user. The stripe-signature header check inside the
# function is what guards it.
verify_jwt = false

[functions.create-checkout]
# Checks the user's token itself, so the CORS preflight can pass.
verify_jwt = false

[functions.billing-portal]
verify_jwt = false
